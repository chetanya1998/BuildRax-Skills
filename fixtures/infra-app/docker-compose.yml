services:
  api:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - db
      - cache
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
  worker:
    build: ./worker
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: not-a-real-password-789
      DATABASE_URL: postgres://app:not-a-real-pass@db:5432/app
  cache:
    image: redis:7
