services:
  api:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - db
      - cache
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
  worker:
    build: ./worker
    depends_on:
      - db
  db:
    image: postgres:16-alpine
  cache:
    image: redis:7
